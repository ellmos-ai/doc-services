[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-services"
version = "0.1.1"
description = "BACH-unabhängige Dokumentenextraktion, OCR und Datenschutzprüfung mit lernender Backend-Präferenz"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = [
  "LICENSE",
  "NOTICE",
  "THIRD_PARTY_LICENSES.md",
  "THIRD_PARTY_LICENSES.txt",
]
authors = [{ name = "Lukas Geiger" }]
maintainers = [{ name = "Lukas Geiger" }]
keywords = [
  "document-extraction",
  "markdown",
  "ocr",
  "privacy",
  "llm-ingestion",
  "pypdfium2",
  "agpl-free",
  "python-docx",
  "cell-deduplication",
  "fail-closed",
  "local-first",
  "zero-egress",
  "rag-preprocessing",
  "mit-license",
  "ellmos-ai",
  "open-bricks",
  "table-extraction",
  "tesseract",
  "data-protection",
  "text-processing",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Natural Language :: German",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Text Processing :: General",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

# Bewusst KEINE harten Abhängigkeiten: das Modul erkennt zur Laufzeit, was da
# ist, und meldet Fehlendes mit Begründung (siehe doc_services/config.py).
# PyMuPDF ist NIRGENDS enthalten - Entscheidung E08, festgehalten in
# tests/test_no_agpl.py.
[project.optional-dependencies]
markitdown = ["markitdown[all]>=0.1.7"]
office = ["python-docx>=1.1", "openpyxl>=3.1"]
pdf = ["pypdf>=4.0"]
ocr = ["pytesseract>=0.3.10", "pillow>=10.0", "pypdfium2>=4.0"]
all = [
  "markitdown[all]>=0.1.7",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pypdf>=4.0",
  "pytesseract>=0.3.10",
  "pillow>=10.0",
  "pypdfium2>=4.0",
]
test = ["pytest>=8.0", "ruff>=0.6"]
dev = ["pytest>=8.0", "ruff>=0.6", "tomli>=2.0; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/ellmos-ai/doc-services"
Repository = "https://github.com/ellmos-ai/doc-services"
Issues = "https://github.com/ellmos-ai/doc-services/issues"
Documentation = "https://github.com/ellmos-ai/doc-services#readme"
"German Documentation" = "https://github.com/ellmos-ai/doc-services/blob/main/README_de.md"
Changelog = "https://github.com/ellmos-ai/doc-services/blob/main/CHANGELOG.md"
Contributing = "https://github.com/ellmos-ai/doc-services/blob/main/CONTRIBUTING.md"
Notice = "https://github.com/ellmos-ai/doc-services/blob/main/NOTICE"
"Third-Party Licenses" = "https://github.com/ellmos-ai/doc-services/blob/main/THIRD_PARTY_LICENSES.md"
"Third-Party Licenses (Text)" = "https://github.com/ellmos-ai/doc-services/blob/main/THIRD_PARTY_LICENSES.txt"
"Plain-Text License" = "https://github.com/ellmos-ai/doc-services/blob/main/LICENSE"
"Security Policy" = "https://github.com/ellmos-ai/doc-services/blob/main/SECURITY.md"
"LLM Context Index" = "https://github.com/ellmos-ai/doc-services/blob/main/llms.txt"
"Marketing Log" = "https://github.com/ellmos-ai/doc-services/blob/main/MARKETING-LOG.txt"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[tool.setuptools]
packages = ["doc_services"]

[tool.setuptools.package-data]
doc_services = ["../profil.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
minversion = "7.0"
addopts = "-ra -v"
norecursedirs = [".git", ".ruff_cache", ".pytest_cache", "__pycache__"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
